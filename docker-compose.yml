services:
  # Aplicação Laravel com PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - /c/docker/www/GraphiCare:/var/www
      - /c/docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel
    depends_on:
      - mysql
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /c/docker/www/GraphiCare:/var/www
      - /c/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel
    depends_on:
      - app

  # Vite Development Server
  vite:
    image: node:20-alpine
    container_name: laravel_vite
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - /c/docker/www/GraphiCare:/var/www
      - vite_node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    networks:
      - laravel
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
      UPLOAD_LIMIT: 300M
    ports:
      - "8080:80"
    networks:
      - laravel
    depends_on:
      - mysql

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel
    command: redis-server --appendonly yes

  # Composer (container auxiliar para executar comandos)
  composer:
    image: composer:latest
    container_name: laravel_composer
    volumes:
      - ./:/app
    working_dir: /app
    networks:
      - laravel
    depends_on:
      - app
    entrypoint: ['composer']
    profiles:
      - tools

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  vite_node_modules:
    driver: local
